name: Build and Push cPanel Deploy Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      - name: Prepare deploy artifacts
        run: |
          cp .cpanel.yml build/web/.cpanel.yml
          if [ -f web/.htaccess ] && [ ! -f build/web/.htaccess ]; then
            cp web/.htaccess build/web/.htaccess
          fi

      - name: Push build/web to deploy branch
        working-directory: build/web
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          git add -A
          git commit -m "Deploy build from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
