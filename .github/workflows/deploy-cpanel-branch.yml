name: Build and Push cPanel Deploy Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      - name: Prepare deploy artifacts
        run: |
          cp .cpanel.yml build/web/.cpanel.yml
          if [ -f web/.htaccess ] && [ ! -f build/web/.htaccess ]; then
            cp web/.htaccess build/web/.htaccess
          fi

      - name: Commit and push build/web to deploy branch (fast-forward)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          rm -rf /tmp/deploy-repo
          if git ls-remote --exit-code --heads "$REPO_URL" deploy >/dev/null 2>&1; then
            git clone --branch deploy --single-branch "$REPO_URL" /tmp/deploy-repo
            find /tmp/deploy-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          else
            git init /tmp/deploy-repo
            git -C /tmp/deploy-repo checkout -B deploy
            git -C /tmp/deploy-repo remote add origin "$REPO_URL"
          fi

          cp -a build/web/. /tmp/deploy-repo/
          cd /tmp/deploy-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy build from ${{ github.sha }}"
            git push origin deploy
          fi
