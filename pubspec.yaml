name: sage_studio
description: "Sage Studio — Contemporary African Luxury Furniture Studio | Nairobi, Kenya"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  provider: ^6.1.1
  url_launcher: ^6.2.4
  archive: ^3.6.1
  http: ^1.2.1
  mailer: ^6.1.2
  supabase_flutter: ^2.15.4
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/founder/
    - assets/images/products/
