  <style>
    body {
      background-color: #E6E3E2;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #725D24;
      background-color: #E6E3E2;
    }
    .loading-title {
      font-family: serif;
      font-size: 28px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .loading-sub {
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="loading-title">SAGE STUDIO</div>
    <div class="loading-sub">NAIROBI, KENYA</div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=908bc1de42560b4411802e67bd71b7cf5b970a09" async></script>
